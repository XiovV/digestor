# Describes your environment for digestor. Copy it to environment.yaml and edit.

# Optional: analyst instructions for Claude. If left out, a built-in default is
# used. digestor adds the stack, the news items and the JSON output format.
# prompt: |
#   You are the security analyst for my homelab. Rate each relevant item
#   critical, high, medium or low. Only nginx is reachable from the internet,
#   so be strict about anything else. Skip Windows-only issues.

# Optional: research instructions for Claude, used for each finding whose
# relevance is listed in research_relevance. If left out, a built-in default is used. digestor adds the stack,
# the finding and the JSON output format.
# research_prompt: |
#   Research this item online: affected versions, CVE identifiers, whether it
#   is actively exploited, and how to fix it. Keep the answer under 800
#   characters and lead with what I should do.

# Optional: which relevance levels get researched online. Each researched
# finding is one extra Claude call with web search, so this drives cost and
# run time. Defaults to [critical, high]; [] turns research off.
# research_relevance: [critical, high]

# Optional: free text about the environment as a whole.
context: |
  Small homelab: 3 Debian hosts running Docker and a k3s cluster.
  Only nginx is reachable from the internet; everything else is LAN-only
  behind a WireGuard VPN.

# Required: the components you run. Only name is required.
#   vendor:   helps tell products with similar names apart
#   type:     free-form, e.g. service, framework, platform, library
#   version:  quote it so YAML keeps it as a string ("1.20" stays "1.20")
#   exposure: internet | internal | local
#   notes:    where and how you run it
stack:
  - name: nginx
    vendor: F5
    type: service
    version: "1.24"
    exposure: internet
    notes: Reverse proxy in front of Gitea and the Django apps.

  - name: PostgreSQL
    type: service
    version: "16"
    exposure: internal

  - name: Gitea
    type: service
    version: "1.22"
    exposure: internal
    notes: Self-hosted Git with Actions runners on a shared Docker host.

  - name: Django
    type: framework
    version: "5.1"

  - name: Debian
    type: platform
    version: "12"

  - name: k3s
    vendor: SUSE
    type: platform
    exposure: internal

# Optional: advisory database queries. Advisories published within the
# fetch window go through the same Claude filter as the RSS items.
# digestor adds the time window, paging and the GitHub token (GITHUB_TOKEN).
# An advisory found by more than one query is reported once.
advisories:
  # GitHub Advisory Database, GET https://api.github.com/advisories.
  # Set at least one of ecosystem, affects or cwes.
  #   name:      optional label for logs and the digest source
  #   ecosystem: go npm pip maven nuget composer rubygems rust erlang actions pub swift other
  #   affects:   package names; package@version keeps only advisories for that version
  #   severity:  one of low, medium, high, critical, unknown
  #   type:      reviewed (default), unreviewed or malware
  #   cwes:      e.g. [CWE-79]
  github:
    - name: Django
      ecosystem: pip
      affects: [django@5.1]

  # Advisories a repository publishes itself,
  # GET https://api.github.com/repos/{owner}/{repo}/security-advisories.
  # They can show up here before they reach the global database.
  github_repos:
    - k3s-io/k3s

  # OSV.dev, POST https://api.osv.dev/v1/query. Covers GitHub's database plus
  # the Go standard library, Linux distributions and more. Set either purl or
  # ecosystem + package (+ optional version). Ecosystem names are
  # case-sensitive: Go, PyPI, npm, crates.io, Debian:12, ...
  osv:
    - name: nginx
      ecosystem: Debian:12
      package: nginx
      version: "1.22.1-9"
    - purl: pkg:golang/stdlib
